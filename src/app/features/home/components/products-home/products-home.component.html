<section class="py-10">
  <div class="container px-2">
    <div class="mx-auto max-w-7xl">
      <app-h2 firstWord="Featured" highlightedWord="Products" />
      <div
        class="mx-auto sm:gap-2 xl:gap-4 gap-1 md:gap-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 max-w-7xl mt-5"
      >
        @for (product of allProducts(); track product._id) {
          <article
            class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-0.75 relative group"
          >
            <!-- Image & Action Buttons Container -->
            <figure
              class="relative w-full h-56 bg-gray-50 rounded-xl overflow-hidden items-center justify-center mb-4"
            >
              <img
                [src]="product.imageCover"
                [alt]="product.slug"
                class="object-cover mx-auto h-full w-full group-hover:scale-105 transition-transform duration-500 max-w-40"
              />

              @if (product.priceAfterDiscount) {
                <!-- float discount review -->
                <div
                  class="absolute top-3 left-3 flex flex-col space-y-2 opacity-90 group-hover:opacity-100 transition-opacity"
                >
                  <!-- discount review -->
                  <div
                    aria-label="Add to wishlist"
                    title="Discount Percentage"
                    class="px-2 py-1 font-bold rounded-sm shadow-md flex items-center justify-center bg-[#FB2C36] text-white hover:scale-110 active:scale-95 transition-all duration-200"
                  >
                    -{{ product.price | discountPercentage: product.priceAfterDiscount }}%
                  </div>
                </div>
              }

              <!-- Floating Action Buttons (Wishlist, Compare, Quick View) -->
              <div
                class="absolute top-3 right-3 flex flex-col space-y-2 opacity-90 group-hover:opacity-100 transition-opacity"
              >
                <!-- Wishlist Button -->
                @if (!product.isWishList) {
                  <button
                    (click)="addToWishlist(product._id)"
                    aria-label="Add to wishlist"
                    title="add to wishlist"
                    class="w-9 h-9 bg-white rounded-full shadow-md flex items-center justify-center text-gray-700 hover:text-danger hover:scale-110 active:scale-95 transition-all duration-200"
                  >
                    <svg
                      class="w-4 h-4"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                      />
                    </svg>
                  </button>
                }
                @if (product.isWishList) {
                  <button
                    (click)="addToWishlist(product._id)"
                    aria-label="Add to wishlist"
                    title="add to wishlist"
                    class="w-9 h-9 bg-white rounded-full shadow-md flex items-center justify-center text-gray-700 hover:text-danger hover:scale-110 active:scale-95 transition-all duration-200"
                  >
                    <i class="fa-solid fa-heart text-danger"></i>
                  </button>
                }
                <!-- Compare Button -->
                <button
                  aria-label="Compare product"
                  title="compare"
                  class="w-9 h-9 bg-white rounded-full shadow-md flex items-center justify-center text-gray-700 hover:text-primary hover:scale-110 active:scale-95 transition-all duration-200"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                    />
                  </svg>
                </button>
                <!-- Quick View Button -->
                <button
                  [routerLink]="['/details', product._id, product.title]"
                  aria-label="Quick view"
                  title="view product"
                  class="w-9 h-9 bg-white rounded-full shadow-md flex items-center justify-center text-gray-700 hover:bg-emerald-600 hover:text-white hover:scale-110 active:scale-95 transition-all duration-200"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    />
                  </svg>
                </button>
              </div>
            </figure>

            <!-- Product Details Header -->
            <header class="space-y-1 mb-4">
              <span class="text-xs font-medium text-gray-400 tracking-wider uppercase">{{
                product.category.name
              }}</span>
              <h3 class="text-lg font-bold text-gray-800 tracking-tight">
                {{ product.title.slice(1, 3) }}
              </h3>
            </header>

            <!-- Rating Section -->
            <div class="flex items-center space-x-1.5 mb-5">
              <div class="flex text-amber-400">
                <!-- 4 Filled Stars & 1 Half/Outlined Star -->
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                  <path
                    d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"
                  />
                </svg>

                <svg
                  class="w-4 h-4 text-amber-400"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
                  />
                </svg>
              </div>
              <span class="text-xs text-gray-500 font-medium">4.8 (18)</span>
            </div>

            <!-- Footer: Price & Add Button -->
            <footer class="flex items-center justify-between pt-2">
              @if (product.priceAfterDiscount) {
                <div>
                  <span class="text-xl font-extrabold text-primary"
                    >{{ product.priceAfterDiscount }} EGP</span
                  ><span class="text-sm text-gray-500 line-through ml-2"
                    >{{ product.price }} EGP</span
                  >
                </div>
              } @else {
                <div class="flex flex-col">
                  <span class="text-xl font-extrabold text-gray-900">{{ product.price }} EGP</span>
                </div>
              }

              <!-- Add to Cart Action Button with Smooth Interactive Hover -->
              <button
                (click)="addProductToCart(product._id)"
                title="add to cart"
                aria-label="Add to cart"
                class="w-11 h-11 bg-emerald-600 rounded-full flex items-center justify-center text-white shadow-md shadow-emerald-600/30 hover:bg-emerald-700 hover:scale-110 active:scale-90 transition-all duration-300"
              >
                <svg
                  class="w-5 h-5 transition-transform duration-300 hover:rotate-90"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  viewBox="0 0 24 24"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
              </button>
            </footer>
          </article>
        }
      </div>
    </div>
  </div>
</section>
