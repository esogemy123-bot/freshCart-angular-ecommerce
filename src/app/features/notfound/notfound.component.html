<section class="min-h-[80vh] flex items-center justify-center px-4 bg-gray-50">
  <div class="text-center max-w-lg mx-auto">
    <!-- Icon or Illustration -->
    <div class="mb-6 flex justify-center">
      <div
        class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl shadow-inner relative"
      >
        <i class="fa-solid fa-cart-shopping opacity-50"></i>
        <span class="absolute text-red-500 font-bold text-5xl">?</span>
      </div>
    </div>

    <!-- Error Code & Title -->
    <h1 class="text-6xl font-black text-gray-800 tracking-wider mb-2">404</h1>
    <h2 class="text-2xl font-bold text-gray-700 mb-3">Oops! Page Not Found</h2>

    <!-- Description -->
    <p class="text-gray-500 mb-8 leading-relaxed">
      It looks like you've followed a broken link or entered a URL that doesn't exist on FreshCart.
      Let's get you back on track for a great shopping experience.
    </p>

    <!-- Action Button -->
    <div>
      <button
        routerLink="/"
        class="inline-flex cursor-pointer items-center justify-center px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-md transition-all duration-300 transform hover:-translate-y-0.5"
      >
        <i class="fa-solid fa-house mr-2"></i> Back to Home
      </button>
    </div>
  </div>
</section>
