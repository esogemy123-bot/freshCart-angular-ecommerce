<div class="min-h-screen bg-gray-50 pb-12">
  <!-- Page Header -->
  <div class="bg-emerald-500 text-white py-8 ">
    <div class="max-w-7xl mx-auto">
      <p class="text-sm opacity-90 mb-3"><span routerLink="/" class="hover:scale-110 cursor-pointer">Home</span> <span class="mx-1">/</span> My Account</p>
      <div class="flex items-center gap-4">
        <div class="bg-white/20 p-3 rounded-xl">
          <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
            />
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold">My Account</h1>
          <p class="opacity-90 text-sm">Manage your addresses and account settings</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto py-8 grid grid-cols-1 md:grid-cols-4 gap-8">
    <!-- Sidebar -->
    <div class="col-span-1 space-y-2">
      <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
        <h2 class="font-bold text-gray-800 mb-4 px-2">My Account</h2>
        <nav class="space-y-1">
          <a
            routerLink="/profile/addresses"
            routerLinkActive="bg-emerald-50 text-green-700"
            class="flex items-center justify-between p-3 rounded-lg text-gray-600 hover:bg-emerald-50 hover:text-emerald-600 transition-colors"
          >
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-location-dot text-sm"></i>
              <span class="font-medium text-sm">My Addresses</span>
            </div>
            <svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </a> 
          <a
            routerLink="/profile/settings"
            routerLinkActive="bg-emerald-50 text-green-700"
            class="flex items-center justify-between p-3 rounded-lg text-gray-600 hover:bg-emerald-50 hover:text-emerald-600 transition-colors"
          >
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-gear text-sm"></i>
              <span class="font-medium text-sm">Settings</span>
            </div>
            <svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </a> 
        </nav>
      </div>
    </div>
    <div [class.col-span-3]="addressesCount === 0">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
