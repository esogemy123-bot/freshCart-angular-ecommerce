<div class="bg-gray-50 min-h-screen">
  <div
    class="bg-linear-to-r from-purple-600 via-purple-500 to-indigo-500 py-12 px-4 sm:px-6 lg:px-8 shadow-inner"
  >
    <div class="max-w-7xl mx-auto">
      <!-- Breadcrumb -->
      <nav class="text-xs sm:text-sm text-purple-200 mb-6 flex items-center gap-2">
        <a href="#" class="hover:text-white transition-colors">Home</a>
        <span>/</span>
        <span class="text-white font-medium">Brands</span>
      </nav>

      <!-- Header Content with Icon -->
      <div class="flex items-center gap-4">
        <!-- Icon Box -->
        <div
          class="w-14 h-14 sm:w-16 sm:h-16 bg-white/15 backdrop-blur-md rounded-2xl border border-white/20 shadow-lg flex items-center justify-center flex-shrink-0 transition-transform hover:scale-105"
        >
          <svg
            class="w-7 h-7 sm:w-8 sm:h-8 text-white"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"
            ></path>
          </svg>
        </div>

        <!-- Title & Subtitle -->
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide">Top Brands</h1>
          <p class="text-xs sm:text-sm text-purple-100 mt-1 font-light">
            Shop from your favorite brands
          </p>
        </div>
      </div>
    </div>
  </div>
  <div class="max-w-7xl mx-auto py-12">
    <!-- Brands Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
      <!-- Brand 1: Canon -->
      @for (brand of brands(); track brand._id) {
        <a
          [routerLink]="['/brandDetails', brand._id]"
          class="group bg-white p-6 rounded-2xl border border-gray-100 shadow-sm hover:shadow-lg hover:border-emerald-100 transition-all duration-300 flex flex-col items-center justify-center gap-4 transform hover:-translate-y-1"
        >
          <div class="w-full h-24 flex items-center justify-center p-2">
            <img
              [src]="brand.image"
              [alt]="brand.name"
              class="max-h-full max-w-full object-contain opacity-80 group-hover:opacity-100 transition-opacity duration-300"
            />
          </div>
          <span
            class="text-sm font-medium text-gray-700 group-hover:text-emerald-600 transition-colors duration-300"
            >{{ brand.name }}</span
          >
        </a>
      }
    </div>
  </div>
</div>
